<div class="form-container">
    <h2>{{ isEditMode ? 'UPDATE STUDENT' : 'CREATE STUDENT' }}</h2>

    <form (ngSubmit)="onSubmit()">
        <!-- Full Name -->
        <div class="form-group">
            <label>Full Name <span class="required">*</span></label>
            <input type="text" [(ngModel)]="studentData.full_name" name="full_name" placeholder="Enter full name" required>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label>Email <span class="required">*</span></label>
            <input type="email" [(ngModel)]="studentData.email" name="email" placeholder="Enter email address" required>
        </div>

        <!-- Department -->
        <div class="form-group">
            <label>Department <span class="required">*</span></label>
            <select [(ngModel)]="studentData.department" name="department" required>
                <option value="" disabled>Select department</option>
                <option value="IT">IT</option>
                <option value="Network">Network</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Software Engineering">Software Engineering</option>
            </select>
        </div>

        <!-- Date of Birth -->
        <div class="form-group">
            <label>Date of Birth <span class="required">*</span></label>
            <input type="date" [(ngModel)]="studentData.date_of_birth" name="date_of_birth" required>
        </div>

        <!-- Photo (Enhanced Modern UI) -->
        <div class="form-group">
            <label>Photo</label>
            <div class="photo-upload-area">
                @if (isEditMode && currentPhoto && !selectedFile) {
                    <div class="current-photo-preview">
                        <img [src]="'http://assignment2api.sorngsiyou.com/storage/' + currentPhoto" alt="Current Photo">
                        <span class="photo-badge">Current</span>
                    </div>
                }
                @if (selectedFile) {
                    <div class="new-file-preview">
                        <span class="file-icon">📄</span>
                        <span class="file-name">{{ selectedFile.name }}</span>
                    </div>
                }

                <label class="custom-file-upload">
                    <span>📁 Choose Photo</span>
                    <input type="file" (change)="onFileSelected($event)" hidden>
                </label>
            </div>
        </div>

        <!-- Status -->
        <div class="form-group">
            <label>Status</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" value="Active" [(ngModel)]="studentData.status" name="status">
                    <span>Active</span>
                </label>
                <label class="radio-label">
                    <input type="radio" value="Inactive" [(ngModel)]="studentData.status" name="status">
                    <span>Inactive</span>
                </label>
            </div>
        </div>

        <!-- Actions Buttons -->
        <div class="form-actions">
            <button type="button" routerLink="/student-list" class="btn-cancel">Cancel</button>
            <button type="submit" [class]="isEditMode ? 'btn-update' : 'btn-save'">
                {{ isEditMode ? 'Update Student' : 'Save Student' }}
            </button>
        </div>
    </form>

    <!-- Success Message Notification -->
    @if (successMessage) {
        <div class="alert-success">
            <span class="alert-icon">✅</span> {{ successMessage }}
        </div>
    }
</div>
